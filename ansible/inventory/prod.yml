all:
  children:
    homelab:
      hosts:
        homelab-prod:
          ansible_host: __PROD_HOST__
          ansible_user: __PROD_USER__
          ansible_become_password: __PROD_ROOT_PASSWORD__
          ansible_pipelining: false
          ansible_python_interpreter: auto_silent
      vars:
        homelab_env: prod
        keepass_group: prod
