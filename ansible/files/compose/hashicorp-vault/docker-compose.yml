services:
  vault:
    build: .
    container_name: vault-lab

    command: server
    restart: unless-stopped

    # Official image user is vault (uid 100, gid 1000). The entrypoint does not
    # chown /vault/data, so the bind mount must already belong to this user.
    user: "100:1000"

    environment:
      VAULT_ADDR: "https://vault-lab:8200"
      SKIP_SETCAP: "true"
      VAULT_SKIP_VERIFY: "true"

    networks:
      - main_network
    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"

    cap_add:
      - IPC_LOCK

    volumes:
      - ./vault_data:/vault/data
      - ./vault_logs:/vault/logs
      - ./config/vault.hcl:/vault/config/vault.hcl:ro

networks:
  main_network:
    external: true
    name: main_network
