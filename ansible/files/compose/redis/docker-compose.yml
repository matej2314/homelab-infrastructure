version: '3.8'

services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis-instance
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --maxmemory 3gb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - main_network
    ports:
      - "6379:6379"

volumes:
  redis_data:

networks:
  main_network:
    external: true
