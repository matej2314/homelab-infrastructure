services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-embedding
    restart: unless-stopped
    networks:
      - main_network
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

      
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - main_network
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "qwen3-embedding:0.6b"]
    restart: "no"

volumes:
  ollama_data:

networks:
    main_network:
        external: true
        name: main_network
