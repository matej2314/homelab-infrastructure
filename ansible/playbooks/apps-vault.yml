---
- name: Layer 3b — HashiCorp Vault (container only; no blind unseal)
  hosts: homelab
  become: true
  vars:
    stack_name: hashicorp-vault
    stack_src: "{{ playbook_dir }}/../files/compose/{{ stack_name }}"
    stack_dest: "{{ homelab_root }}/{{ stack_name }}"
  tasks:
    - name: Ensure stack directory exists
      ansible.builtin.file:
        path: "{{ stack_dest }}"
        state: directory
        mode: "0755"

    - name: Sync compose files to server
      ansible.builtin.copy:
        src: "{{ stack_src }}/"
        dest: "{{ stack_dest }}/"
        mode: "0644"

    # Raft opens /vault/data/vault.db as uid 100. Ansible and Docker create
    # the bind-mount directory as root, which the vault user cannot write.
    - name: Ensure Vault data and logs directories exist
      ansible.builtin.file:
        path: "{{ stack_dest }}/{{ item }}"
        state: directory
        owner: "100"
        group: "1000"
        mode: "0750"
      loop:
        - vault_data
        - vault_logs

    - name: Ensure existing Vault data and logs are owned by the container user
      ansible.builtin.file:
        path: "{{ stack_dest }}/{{ item }}"
        state: directory
        owner: "100"
        group: "1000"
        recurse: true
      loop:
        - vault_data
        - vault_logs

    - name: Deploy Vault container
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dest }}"
        state: present
        build: always
        pull: policy

    - name: Reminder — init/unseal is manual / documented, not every-run
      ansible.builtin.debug:
        msg: >-
          Do not re-init on rerun.
          Store root token (vault_root_token) and unseal keys in KeepassXC under homelab-infrastructure/{{keepass_group}}.
          Ansible does not unseal blindly.
