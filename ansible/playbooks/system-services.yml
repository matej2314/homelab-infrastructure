---
- name: Layer 2 - host monitoring and operator tools
  hosts: homelab
  become: true
  vars:
    keepass_script: "{{playbook_dir}}/../scripts/keepass-get.sh"
    prometheus_listen_port: 6705
    prometheus_config_dest: /etc/prometheus/prometheus.yml
    prometheus_default_dest: /etc/default/prometheus
    grafana_provisioning_datasources: /etc/grafana/provisioning/datasources/prometheus.yml
    grafana_provisioning_dashboards: /etc/grafana/provisioning/dashboards/homelab.yml
    grafana_dashboards_dir: /var/lib/grafana/dashboards
    grafana_systemd_dropin_dir: /etc/systemd/system/grafana-server.service.d
    grafana_systemd_dropin: /etc/systemd/system/grafana-server.service.d/override.conf
  tasks:
    - name: Install operator packages
      ansible.builtin.apt:
        name:
          - btop
        state: present
        update_cache: true

    - name: Clean up leftover deb.griffo.io repo (one-time migration)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/deb-griffo-io.list
        - /etc/apt/keyrings/deb-griffo-io.gpg
        - /etc/apt/keyrings/deb-griffo-io.asc
        - /tmp/deb-griffo-io.asc

    - name: Check if lazydocker is installed
      ansible.builtin.command: lazydocker --version
      register: lazydocker_check
      changed_when: false
      failed_when: false

    - name: Get latest lazydocker version from GitHub API
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazydocker/releases/latest
        return_content: true
      register: lazydocker_release
      when: lazydocker_check.rc != 0

    - name: Install lazydocker binary from GitHub Releases
      ansible.builtin.unarchive:
        src: >-
          https://github.com/jesseduffield/lazydocker/releases/download/
          {{- lazydocker_release.json.tag_name -}}
          /lazydocker_
          {{- lazydocker_release.json.tag_name | regex_replace('^v','') -}}
          _Linux_x86_64.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include:
          - lazydocker
        mode: "0755"
      when: lazydocker_check.rc != 0

    - name: Install Prometheus and node_exporter (Ubuntu packages)
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-node-exporter
        state: present
        update_cache: true

    - name: Configure Prometheus listen address ({{ prometheus_listen_port }})
      ansible.builtin.copy:
        content: |
          # Managed by Ansible — Prometheus listen address (homelab)
          # Debian/Ubuntu package reads ARGS for the prometheus unit.
          ARGS="--web.listen-address=0.0.0.0:{{ prometheus_listen_port }}"
        dest: "{{ prometheus_default_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart prometheus

    - name: Deploy prometheus configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/system/prometheus.yml"
        dest: "{{ prometheus_config_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart prometheus

    # --- Grafana: credentials drop-in BEFORE package install ---
    # dpkg postinst does daemon-reload + start; if the drop-in already
    # exists, Grafana boots with the correct admin credentials on first
    # install — no masking needed.

    - name: Fetch Grafana admin user from KeePassXC
      ansible.builtin.command:
        argv:
          - "{{ keepass_script }}"
          - "{{ keepass_group }}"
          - GRAFANA_ADMIN_USER
      delegate_to: localhost
      become: false
      register: grafana_admin_user
      changed_when: false
      no_log: true

    - name: Fetch Grafana admin password from KeePassXC
      ansible.builtin.command:
        argv:
          - "{{ keepass_script }}"
          - "{{ keepass_group }}"
          - GRAFANA_ADMIN_PASSWORD
      delegate_to: localhost
      become: false
      register: grafana_admin_password
      changed_when: false
      no_log: true

    - name: Fetch Grafana server port from KeePassXC
      ansible.builtin.command:
        argv:
          - "{{ keepass_script }}"
          - "{{ keepass_group }}"
          - GRAFANA_SERVER_PORT
      delegate_to: localhost
      become: false
      register: grafana_server_port
      changed_when: false
      no_log: true

    - name: Ensure grafana systemd drop-in directory exists
      ansible.builtin.file:
        path: "{{ grafana_systemd_dropin_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy grafana admin credentials via systemd drop-in
      ansible.builtin.copy:
        content: |
          # Managed by Ansible — do not edit; secrets from KeePassXC
          [Service]
          Environment=GF_SECURITY_ADMIN_USER={{ grafana_admin_user.stdout }}
          Environment=GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password.stdout }}
          Environment=GF_SERVER_HTTP_PORT={{ grafana_server_port.stdout }}
        dest: "{{ grafana_systemd_dropin }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart grafana

    # --- Grafana: APT install (drop-in already on disk) ---

    - name: Install Grafana APT prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - wget
          - gnupg
        state: present

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Grafana Labs GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add Grafana Labs APT repository (stable)
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main
        filename: grafana
        state: present

    - name: Install Grafana OSS from Grafana Labs APT
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Ensure grafana provisioning datasources directory exists
      ansible.builtin.file:
        path: "{{ grafana_provisioning_datasources | dirname }}"
        state: directory
        mode: "0755"

    - name: Deploy grafana prometheus datasource
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/system/grafana-datasource.yml"
        dest: "{{ grafana_provisioning_datasources }}"
        owner: root
        group: grafana
        mode: "0644"
      notify: Restart grafana

    - name: Ensure grafana dashboards directory exists
      ansible.builtin.file:
        path: "{{ grafana_dashboards_dir }}"
        state: directory
        owner: grafana
        group: grafana
        mode: "0755"

    - name: Ensure grafana provisioning dashboards directory exists
      ansible.builtin.file:
        path: "{{ grafana_provisioning_dashboards | dirname }}"
        state: directory
        mode: "0755"

    - name: Deploy grafana dashboards provider
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/system/grafana-dashboards.yml"
        dest: "{{ grafana_provisioning_dashboards }}"
        owner: root
        group: grafana
        mode: "0644"
      notify: Restart grafana

    - name: Sync grafana dashboard JSON files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/system/dashboards/"
        dest: "{{ grafana_dashboards_dir }}/"
        owner: grafana
        group: grafana
        mode: "0644"
      notify: Restart grafana

    - name: Enable and start node_exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    - name: Enable and start prometheus
      ansible.builtin.service:
        name: prometheus
        state: started
        enabled: true

    - name: Enable and start grafana
      ansible.builtin.service:
        name: grafana-server
        state: started
        enabled: true

  handlers:
    - name: Restart prometheus
      ansible.builtin.service:
        name: prometheus
        state: restarted

    - name: Restart grafana
      ansible.builtin.service:
        name: grafana-server
        state: restarted
