---
- name: KeePassXC smoke — write one secret to remote file or fail hard
  hosts: homelab
  gather_facts: false
  become: false
  vars:
    keepass_script: "{{ playbook_dir }}/../scripts/keepass-get.sh"
    remote_test_path: /tmp/homelab-keepass-smoke
  tasks:
    - name: Fetch test secret from KeePassXC on control node
      ansible.builtin.command:
        argv:
          - "{{ keepass_script }}"
          - "{{ keepass_group }}"
          - ansible_lab_test
      delegate_to: localhost
      become: false
      register: keepass_test
      changed_when: false
      no_log: true

    - name: Write secret to remote file with mode 0600
      ansible.builtin.copy:
        content: "{{ keepass_test.stdout }}"
        dest: "{{ remote_test_path }}"
        mode: "0600"
      no_log: true
      become: false

    - name: Reminder — remove smoke file after check
      ansible.builtin.debug:
        msg: "Secret written to {{ remote_test_path }} (mode 0600). Remove after verifying."
