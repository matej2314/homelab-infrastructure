---
- name: Layer 1 - Docker Engine + main_network
  hosts: homelab
  become: true
  tasks:
    - name: Install prerequisites for Docker apt repo
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo:  >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ansible SSH user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Drop SSH session so docker group applies
      ansible.builtin.meta: reset_connection

    - name: Create external Docker network main_network
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        state: present

    - name: Ensure homelab root directory exists
      ansible.builtin.file:
        path: "{{ homelab_root }}"
        state: directory
        mode: "0755"

    - name: Verify docker CLI works without sudo
      ansible.builtin.command:
        argv:
          - docker
          - info
      become: false
      changed_when: false