---
- name: Layer 3a — Nginx Proxy Manager
  hosts: homelab
  become: true
  vars:
    keepass_script: "{{ playbook_dir }}/../scripts/keepass-get.sh"
    stack:
      name: nginx-proxy-manager
      env_keys:
        - { env: NPM_ADMIN_EMAIL, key: NPM_ADMIN_EMAIL }
        - { env: NPM_ADMIN_PASSWORD, key: NPM_ADMIN_PASSWORD }
  tasks:
    - name: Deploy Nginx Proxy Manager
      ansible.builtin.include_tasks: ../tasks/deploy-stack-with-env.yml
