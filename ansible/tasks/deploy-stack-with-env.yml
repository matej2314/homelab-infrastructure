---
- name: "Ensure directory for {{ stack.name }}"
  ansible.builtin.file:
    path: "{{ homelab_root }}/{{ stack.name }}"
    state: directory
    mode: "0755"

- name: "Sync compose for {{ stack.name }}"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/compose/{{ stack.name }}/"
    dest: "{{ homelab_root }}/{{ stack.name }}/"
    mode: "0644"

- name: "Build .env lines for {{ stack.name }} from KeePassXC"
  ansible.builtin.shell: |
    set -euo pipefail
    SCRIPT="{{ keepass_script }}"
    GROUP="{{keepass_group}}"
    {
    {% for item in stack.env_keys %}
      VAL=$("$SCRIPT" "$GROUP" "{{ item.key }}")
      printf '%s=%s\n' "{{ item.env }}" "$VAL"
    {% endfor %}
    }
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: env_file_body
  changed_when: false
  no_log: true

- name: "Write .env for {{ stack.name }} (0600)"
  ansible.builtin.copy:
    content: "{{ env_file_body.stdout }}\n"
    dest: "{{ homelab_root }}/{{ stack.name }}/.env"
    mode: "0600"
  no_log: true

- name: "Compose up {{ stack.name }}"
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_root }}/{{ stack.name }}"
    state: present
    pull: policy
