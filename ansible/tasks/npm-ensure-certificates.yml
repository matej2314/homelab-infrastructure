---
- name: Fetch DuckDNS token from KeepassXC
  ansible.builtin.command:
    argv:
      - "{{keepass_script}}"
      - "{{keepass_group}}"
      - NGINX_DUCKDNS_TOKEN
  delegate_to: localhost
  become: false
  register: npm_duckdns_token
  changed_when: false
  no_log: true

- name: List existing NPM certificates
  ansible.builtin.uri:
    url: "{{npm_api_url}}/nginx/certificates"
    method: GET
    headers:
      Authorization: "Bearer {{npm_api_token}}"
    status_code: 200
    timeout: "{{npm_api_timeout}}"
  register: npm_certs_list
  no_log: true

- name: Ensure each desired certificate exists
  ansible.builtin.include_tasks: npm-ensure-one-certificate.yml
  loop: "{{npm_desired_certs}}"
  loop_control:
    loop_var: desired_cert
    label: "{{desired_cert.nice_name | default(desired_cert.domain_names | join(', '))}}"

- name: Set primary wildcard certificate id fact
  ansible.builtin.set_fact:
    npm_wildcard_cert_id: "{{npm_cert_ids_by_nice_name[npm_desired_certs[0].nice_name]}}"
