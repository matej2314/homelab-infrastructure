[defaults]
inventory = inventory/lab.yml
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
gathering = smart
become_plugins = plugins/become

[privilege_escalation]
become = True
become_method = sudo
# Domyślne flagi sudo to -H -S -n. Flaga -n (non-interactive) blokuje prompt
# hasła: Ansible czeka 12s i kończy Timeout waiting for privilege escalation.
become_flags = -H -S

[ssh_connection]
pipelining = False